<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Visite Digitale - Mohamed-Amine Drablia</title>
    <style>
        /* ===== RESET ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== BODY ===== */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #090710 0%, #110d22 50%, #05040a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== BACKGROUND : grille de points orange ===== */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(225, 77, 42, 0.12) 1.2px, transparent 1.2px);
            background-size: 16px 16px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
            mask-image: linear-gradient(to bottom right, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: linear-gradient(to bottom right, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
        }

        /* ===== CARTE PRINCIPALE ===== */
        .card-container {
            width: 100%;
            max-width: 620px;
            background: linear-gradient(145deg, rgba(20, 16, 36, 0.9) 0%, rgba(11, 9, 20, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 40px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(225, 77, 42, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2;
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: center;
            position: relative;
        }

        /* Séparateur vertical central */
        .card-container::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 45%;
            height: 70%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.08), transparent);
        }

        /* ===== COLONNE GAUCHE : profil ===== */
        .profile-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-right: 10px;
            z-index: 3;
        }

        /* Logo HubCity */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-hub {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .logo-city {
            color: #e14d2a;
        }

        .tagline {
            font-size: 7.5px;
            color: #7b7699;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 4px;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Avatar circulaire */
        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .avatar-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            object-position: center center;
            position: absolute;
            top: 10px;
            left: 0;
            z-index: 4;
        }

        .avatar-initials {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            transform: rotate(-35deg);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* Nom et titre */
        .name {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .firstname {
            color: #e14d2a;
        }

        .title {
            font-size: 8px;
            color: #e14d2a;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 700;
        }

        /* ===== COLONNE DROITE : coordonnées ===== */
        .info-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            z-index: 3;
        }

        .section-title {
            font-size: 9px;
            text-transform: uppercase;
            color: #555075;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: -4px;
            padding-left: 4px;
        }

        /* Ligne de contact */
        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 12px 16px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Icône bleue par défaut */
        .info-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: rgba(32, 70, 138, 0.2);
            border: 1px solid rgba(32, 70, 138, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #3b76e1;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        /* Icône orange pour email et LinkedIn */
        .info-item[href^="mailto"] .info-icon,
        .info-item[href*="linkedin"] .info-icon {
            background: rgba(225, 77, 42, 0.1);
            border: 1px solid rgba(225, 77, 42, 0.3);
            color: #e14d2a;
        }

        .info-details {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 7.5px;
            text-transform: uppercase;
            color: #555075;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .info-value {
            font-size: 13px;
            color: #d1cfe2;
            font-weight: 500;
        }

        /* Hover sur desktop */
        @media (hover: hover) {
            .info-item:hover {
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(225, 77, 42, 0.4);
                transform: translateX(6px);
            }

            .info-item:hover .info-icon {
                transform: scale(1.05);
            }
        }

        /* ===== FOOTER ===== */
        .card-footer {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 7px;
            color: #403c5a;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ===== RESPONSIVE MOBILE ===== */
        @media (max-width: 580px) {
            .card-container {
                flex-direction: column;
                gap: 30px;
                padding: 35px 25px;
                max-width: 360px;
            }

            .card-container::after {
                display: none;
            }

            .profile-side {
                padding-right: 0;
                width: 100%;
            }

            .info-side {
                flex: none;
                gap: 10px;
            }

            .section-title {
                text-align: center;
                margin-bottom: 2px;
            }

            .card-footer {
                position: relative;
                bottom: 0;
                right: 0;
                text-align: center;
                margin-top: 15px;
            }
        }
    </style>
